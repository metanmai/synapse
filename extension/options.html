<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Synapse Browser Capture</title>
  </head>
  <body>
    <h1>Synapse Browser Capture</h1>
    <p>Paste the ingest token <code>synapsesync</code> printed when you enabled browser capture.</p>
    <p>
      <label>Ingest token<br /><input id="token" type="password" size="60" /></label>
    </p>
    <p>
      <label>Daemon port<br /><input id="port" type="number" value="7726" /></label>
    </p>
    <button id="save" type="button">Save</button>
    <span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
