name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Frontend env for typecheck
        run: cp frontend/.env.example frontend/.env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  migrate:
    # Applies pending Supabase migrations on push-to-main. Gracefully skips
    # (job stays GREEN) when secrets aren't configured yet — see BUGS.md
    # "Configure Supabase secrets so CI auto-migrate activates" for the
    # one-time setup. Once secrets are set, this job will apply migrations
    # automatically without manual `supabase db push`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase secrets are configured
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase auto-migrate skipped — SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF not configured in repo secrets. See BUGS.md for setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.check.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Apply pending migrations
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check secrets are set
        run: |
          if [ -z "$TEST_SUPABASE_URL" ]; then echo "::error::TEST_SUPABASE_URL is not set"; exit 1; fi
          if [ -z "$TEST_SUPABASE_SERVICE_KEY" ]; then echo "::error::TEST_SUPABASE_SERVICE_KEY is not set"; exit 1; fi
          echo "Secrets are configured"
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}

      - name: Build MCP CLI
        working-directory: mcp
        run: npm run build

      - name: Frontend env for e2e
        run: cp frontend/.env.example frontend/.env

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e (UI)
        working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"

      - name: E2E tests
        working-directory: mcp
        run: npx vitest run test/e2e/
        env:
          TEST_E2E: "1"
          TEST_API_URL: ${{ secrets.TEST_API_URL }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  proxy-linux-e2e:
    # Cross-distro Linux trust-store install gate (Slice A.5).
    # Builds 5 distro-specific Docker containers and runs `synapsesync
    # capture proxy install/status/uninstall` against each one's REAL
    # trust store — covers spec §4.2 paths (debian / rhel / unknown).
    # Cannot run on the maintainer's macOS machine because Netskope
    # blocks container egress to the public npm registry; this is the
    # canonical validation environment.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, ubuntu, fedora, rockylinux, arch]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: scripts/e2e-linux/Dockerfile.${{ matrix.distro }}
          tags: synapse-e2e-${{ matrix.distro }}:ci
          load: true
          cache-from: type=gha,scope=proxy-linux-${{ matrix.distro }}
          cache-to: type=gha,scope=proxy-linux-${{ matrix.distro }},mode=max

      - name: Run E2E
        run: docker run --rm synapse-e2e-${{ matrix.distro }}:ci

  proxy-windows-e2e:
    # Windows trust-store install gate (Slice B). Mirror of the Linux
    # Docker matrix shape but runs natively on windows-latest because
    # (a) Windows containers are heavier than the test value justifies,
    # (b) GHA's windows-latest already ships Git-for-Windows (which
    # provides openssl on PATH) + certutil (builtin since Vista) — the
    # two tools the daemon's openssl-spawn + WindowsBackend need.
    # Validates `synapsesync capture proxy install/status/uninstall`
    # against the real CurrentUser Root certificate store.
    runs-on: windows-latest
    timeout-minutes: 15
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (workspace root)
        run: npm install --no-audit --no-fund

      - name: Build mcp CLI
        run: npm run build --workspace=mcp

      - name: Run Windows proxy E2E
        shell: powershell
        run: ./scripts/e2e-windows/e2e-proxy-install.ps1
