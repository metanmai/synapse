name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Lint, typecheck, and unit test on BOTH ubuntu-latest and
    # windows-latest. Phase 3 of Windows-readiness: catch
    # platform-specific bugs in code AND tests on every push, not just
    # at the e2e layer.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash  # Git Bash on windows-latest; works on both runners.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 needed on Windows because @synapse/shared ships .ts
          # only (relies on native type-stripping in v24+). Same version
          # both runners to keep the matrix simple.
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend env for typecheck
        run: cp frontend/.env.example frontend/.env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  migrate:
    # Applies pending Supabase migrations on push-to-main. Gracefully skips
    # (job stays GREEN) when secrets aren't configured yet — see BUGS.md
    # "Configure Supabase secrets so CI auto-migrate activates" for the
    # one-time setup. Once secrets are set, this job will apply migrations
    # automatically without manual `supabase db push`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase secrets are configured
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase auto-migrate skipped — SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF not configured in repo secrets. See BUGS.md for setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.check.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Apply pending migrations
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all

  e2e:
    # Cross-OS e2e matrix. Both Linux and Windows must pass before we
    # call Synapse Windows-ready. Per Phase 3 of the Windows-readiness
    # plan: enable Windows early in a probably-red state so CI surfaces
    # every remaining platform-specific bug automatically, then fix what
    # surfaces.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # `bash` on windows-latest is Git Bash (always installed). Keeping
        # one shell across both runners means the `if [ -z ... ]` checks
        # and `cp` / `npx` invocations below work identically without
        # per-OS branches.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 needed on Windows because @synapse/shared ships .ts
          # only (relies on Node's native type-stripping in v24+). Linux
          # already proven on v24 via the proxy-linux-e2e matrix. Keep
          # both runners on the same major.
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check secrets are configured
        # Mirrors the `migrate` job's graceful-skip pattern. The TEST_SUPABASE_*
        # secrets live on metanmai/synapse (where the bot mirrors and the
        # canonical CI run lives). When this workflow fires on tanmain/synapse
        # (the push target with no secrets), e2e gracefully skips so the job
        # stays GREEN — the metanmai run still validates e2e end-to-end with
        # real secrets. Hard-failing here would block every push to tanmain.
        id: check
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$TEST_SUPABASE_URL" ] || [ -z "$TEST_SUPABASE_SERVICE_KEY" ]; then
            echo "::notice::e2e skipped — TEST_SUPABASE_URL / TEST_SUPABASE_SERVICE_KEY not configured on this repo. Mirror to metanmai/synapse for the validated run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MCP CLI
        if: steps.check.outputs.configured == 'true'
        working-directory: mcp
        run: npm run build

      - name: Frontend env for e2e
        if: steps.check.outputs.configured == 'true'
        run: cp frontend/.env.example frontend/.env

      - name: Install Playwright browsers (Linux — includes system deps)
        if: steps.check.outputs.configured == 'true' && matrix.os == 'ubuntu-latest'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browsers (Windows — no system deps needed)
        # `--with-deps` runs apt-get; on Windows it's a no-op-ish but
        # explicitly omitting it surfaces a clearer error if browsers
        # can't be downloaded.
        if: steps.check.outputs.configured == 'true' && matrix.os == 'windows-latest'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Playwright e2e (UI)
        if: steps.check.outputs.configured == 'true'
        working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"

      - name: E2E tests
        if: steps.check.outputs.configured == 'true'
        working-directory: mcp
        # Route through the JSON-reporter wrapper that tolerates vitest 4's
        # "Worker exited unexpectedly" teardown crash on Windows CI.
        # Without the wrapper, all 121 e2e tests pass but vitest exits 1
        # because tinypool's fork-worker shutdown races; the wrapper reads
        # the JSON report and exits 0 when there are no test failures.
        # See mcp/scripts/run-tests.mjs for the rationale + the matching
        # `npm test` script wiring already in place for the verify job.
        run: node ./scripts/run-tests.mjs test/e2e/
        env:
          TEST_E2E: "1"
          TEST_API_URL: ${{ secrets.TEST_API_URL }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}

      - name: Upload Playwright report
        if: failure() && steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: frontend/playwright-report/
          retention-days: 7

  proxy-linux-e2e:
    # Cross-distro Linux trust-store install gate (Slice A.5).
    # Builds 5 distro-specific Docker containers and runs `synapsesync
    # capture proxy install/status/uninstall` against each one's REAL
    # trust store — covers spec §4.2 paths (debian / rhel / unknown).
    # Cannot run on the maintainer's macOS machine because Netskope
    # blocks container egress to the public npm registry; this is the
    # canonical validation environment.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, ubuntu, fedora, rockylinux, arch]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: scripts/e2e-linux/Dockerfile.${{ matrix.distro }}
          tags: synapse-e2e-${{ matrix.distro }}:ci
          load: true
          cache-from: type=gha,scope=proxy-linux-${{ matrix.distro }}
          cache-to: type=gha,scope=proxy-linux-${{ matrix.distro }},mode=max

      - name: Run E2E
        run: docker run --rm synapse-e2e-${{ matrix.distro }}:ci

  proxy-windows-e2e:
    # Windows trust-store install gate (Slice B). Mirror of the Linux
    # Docker matrix shape but runs natively on windows-latest because
    # (a) Windows containers are heavier than the test value justifies,
    # (b) GHA's windows-latest already ships Git-for-Windows (which
    # provides openssl on PATH) + certutil (builtin since Vista) — the
    # two tools the daemon's openssl-spawn + WindowsBackend need.
    # Validates `synapsesync capture proxy install/status/uninstall`
    # against the real CurrentUser Root certificate store.
    runs-on: windows-latest
    timeout-minutes: 15
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (workspace root)
        run: npm install --no-audit --no-fund

      - name: Build mcp CLI
        run: npm run build --workspace=mcp

      - name: Run Windows proxy E2E
        # `pwsh` = PowerShell 7 Core. UTF-8 native, modern parser, cross-OS
        # consistent. `powershell` (Windows PowerShell 5.1) reads scripts
        # as code-page-dependent and misparses UTF-8 chars as mojibake.
        shell: pwsh
        run: ./scripts/e2e-windows/e2e-proxy-install.ps1

  happy-flow-e2e:
    # The merge-gate test (`npm run test:e2e`) — the same 5-script suite
    # developers run locally before merging — pinned to BOTH Linux and
    # Windows. Proves the universal driver + curl-via-proxy + recall
    # paths actually work on every supported OS, not just whichever
    # machine the dev happened to use.
    #
    # The scripts are agent-agnostic: Stage 3 + Stage 7 use the universal
    # LLM driver (direct-API curl with ANTHROPIC_API_KEY / OPENROUTER_API_KEY
    # / DEEPSEEK_API_KEY — whichever is configured), proxy-layer5 +
    # proxy-source use curl through TLS-MITM. No `claude not on PATH →
    # exit 0` soft-skip in any of them.
    #
    # Graceful skip pattern: when secrets aren't configured (tanmain/
    # synapse), the job logs a notice and exits green. The canonical run
    # is on metanmai/synapse where SYNAPSE_E2E_API_KEY + at least one
    # provider API key are configured.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows; same shell on Linux. Lets one set of
        # commands handle both runners without per-OS branches.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the rest of the e2e matrix — Node 24 for native .ts
          # type-stripping on Windows.
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check secrets are configured
        # Mirrors the `e2e` job's pattern: skip-green when keys are absent
        # (tanmain), run-validated when present (metanmai). Requires
        # SYNAPSE_E2E_API_KEY + at least one provider API key.
        id: check
        env:
          SYNAPSE_E2E_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$SYNAPSE_E2E_API_KEY" ]; then
            echo "::notice::happy-flow-e2e skipped — SYNAPSE_E2E_API_KEY not configured. Mirror to metanmai/synapse for the validated run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ] && [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::notice::happy-flow-e2e skipped — no LLM provider key configured (needs ANTHROPIC_API_KEY / OPENROUTER_API_KEY / DEEPSEEK_API_KEY). Mirror to metanmai/synapse for the validated run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build mcp
        if: steps.check.outputs.configured == 'true'
        run: npm run build --workspace=mcp

      - name: Enable proxy (spawns capture-worker)
        # `capture proxy enable` writes proxy-config.json + spawns a fresh
        # detached capture-worker process (which owns the file watcher +
        # the TLS-MITM proxy listening on 7727). SYNAPSE_API_KEY is
        # exported so any process spawned in this shell session inherits
        # it.
        #
        # NOTE: this step does NOT start the daemon-proper (the process
        # that owns the handoff sync loop + writes daemon.healthcheck).
        # On a real machine the OS service (launchd / systemd / Task
        # Scheduler) starts daemon-proper. CI runners don't have that,
        # so the next step starts it manually.
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
        run: |
          mkdir -p "$HOME/.synapse"
          node mcp/dist/index.js capture proxy enable

      - name: Start daemon-proper (handoff loop + healthcheck heartbeat)
        # The daemon-proper is a separate process from the capture-worker.
        # It owns the per-project flush/pull cycle, the pull-handoff
        # pre-warm, and the daemon.healthcheck heartbeat that the next
        # step polls for. Locally an OS service unit (launchd plist /
        # systemd unit / Task Scheduler XML) runs it; in CI we have to
        # background it manually. `nohup ... &` works in both Bash on
        # Linux and Git Bash on Windows.
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
        run: |
          nohup node mcp/dist/index.js daemon > "$HOME/.synapse/daemon.log" 2>&1 &
          echo "daemon-proper backgrounded (PID $!) — log: $HOME/.synapse/daemon.log"

      - name: Wait for daemon healthcheck
        # daemon-proper's startHandoffLoop() writes ~/.synapse/daemon.healthcheck
        # on a setInterval cadence (default 10s). 30s budget gives the
        # spawned process plenty of time to import modules + reach the
        # first interval tick.
        if: steps.check.outputs.configured == 'true'
        run: |
          for i in $(seq 1 30); do
            if [ -f "$HOME/.synapse/daemon.healthcheck" ]; then
              echo "Daemon healthcheck present after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Daemon never wrote healthcheck file after 30s"
          echo "--- ~/.synapse/daemon.log ---"
          cat "$HOME/.synapse/daemon.log" 2>/dev/null || echo "(no daemon.log)"
          echo "--- ~/.synapse/capture.log ---"
          cat "$HOME/.synapse/capture.log" 2>/dev/null || echo "(no capture.log)"
          exit 1

      - name: Run merge gate (npm run test:e2e)
        # Stage 3 + Stage 7 use direct-API mode via whichever provider key
        # is configured (ANTHROPIC / OPENROUTER / DEEPSEEK). No claude/crush
        # binary required. proxy-layer5 + proxy-source use curl.
        # proxy-lifecycle manages its own daemons.
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run test:e2e

      - name: Dump daemon log on failure
        if: failure() && steps.check.outputs.configured == 'true'
        run: |
          echo "--- ~/.synapse/capture.log (last 200 lines) ---"
          tail -200 "$HOME/.synapse/capture.log" 2>/dev/null || true
          echo "--- ~/.synapse/daemon.log (last 200 lines) ---"
          tail -200 "$HOME/.synapse/daemon.log" 2>/dev/null || true
          echo "--- ~/.synapse/proxy-config.json ---"
          cat "$HOME/.synapse/proxy-config.json" 2>/dev/null || true
