name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Lint, typecheck, and unit test on BOTH ubuntu-latest and
    # windows-latest. Phase 3 of Windows-readiness: catch
    # platform-specific bugs in code AND tests on every push, not just
    # at the e2e layer.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash  # Git Bash on windows-latest; works on both runners.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 needed on Windows because @synapse/shared ships .ts
          # only (relies on native type-stripping in v24+). Same version
          # both runners to keep the matrix simple.
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend env for typecheck
        run: cp frontend/.env.example frontend/.env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  cleanup-e2e-account:
    # Hygiene gate for the shared E2E test account. Every E2E run creates
    # test projects; failed/cancelled runs leak them past their own sweeps.
    # At ~15 leaked runs the account hits the 50-project cap and the backend
    # returns 402 PROJECT_QUOTA_EXCEEDED on every create — CI red that LOOKS
    # like an adapter-roundtrip flake but is quota noise (root-caused
    # 2026-06-09/10, LAUNCH-READINESS #5). This job force-deletes projects
    # older than 45 minutes BEFORE the account-using jobs run. The 45-min
    # threshold is the concurrency guard: the parallel e2e + happy-flow
    # matrix legs (and any just-cancelled prior run) only own projects
    # younger than that, so a sweep can never delete in-flight work.
    # Graceful-skip pattern: green no-op on tanmain where secrets are absent.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check secrets are configured
        id: check
        env:
          SYNAPSE_E2E_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
        run: |
          if [ -z "$SYNAPSE_E2E_API_KEY" ]; then
            echo "::notice::cleanup-e2e-account skipped — SYNAPSE_E2E_API_KEY not configured. Mirror to metanmai/synapse for the validated run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sweep stale test-account projects
        # Zero-dep script — no npm install needed. Exit 0 even when single
        # deletes fail (hygiene must not mask the real e2e signal); exit 2
        # only on preflight failures (no key / list endpoint down).
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_E2E_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
        run: node scripts/cleanup-test-account.mjs --yes

  migrate:
    # Applies pending Supabase migrations on push-to-main. Gracefully skips
    # (job stays GREEN) when secrets aren't configured yet — see BUGS.md
    # "Configure Supabase secrets so CI auto-migrate activates" for the
    # one-time setup. Once secrets are set, this job will apply migrations
    # automatically without manual `supabase db push`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Check Supabase secrets are configured
        id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase auto-migrate skipped — SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF not configured in repo secrets. See BUGS.md for setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.check.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Apply pending migrations
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all

  e2e:
    # Cross-OS e2e matrix. Both Linux and Windows must pass before we
    # call Synapse Windows-ready. Per Phase 3 of the Windows-readiness
    # plan: enable Windows early in a probably-red state so CI surfaces
    # every remaining platform-specific bug automatically, then fix what
    # surfaces.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # cleanup-e2e-account ordering: the capture-pipeline Cloud Sync suite
    # (TEST_SYNAPSE_API_KEY below) writes to the shared E2E account, so it
    # must run after the stale-project sweep, same as happy-flow-e2e.
    needs: [verify, cleanup-e2e-account]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # `bash` on windows-latest is Git Bash (always installed). Keeping
        # one shell across both runners means the `if [ -z ... ]` checks
        # and `cp` / `npx` invocations below work identically without
        # per-OS branches.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 needed on Windows because @synapse/shared ships .ts
          # only (relies on Node's native type-stripping in v24+). Linux
          # already proven on v24 via the proxy-linux-e2e matrix. Keep
          # both runners on the same major.
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check secrets are configured
        # Mirrors the `migrate` job's graceful-skip pattern. The TEST_SUPABASE_*
        # secrets live on metanmai/synapse (where the bot mirrors and the
        # canonical CI run lives). When this workflow fires on tanmain/synapse
        # (the push target with no secrets), e2e gracefully skips so the job
        # stays GREEN — the metanmai run still validates e2e end-to-end with
        # real secrets. Hard-failing here would block every push to tanmain.
        id: check
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$TEST_SUPABASE_URL" ] || [ -z "$TEST_SUPABASE_SERVICE_KEY" ]; then
            echo "::notice::e2e skipped — TEST_SUPABASE_URL / TEST_SUPABASE_SERVICE_KEY not configured on this repo. Mirror to metanmai/synapse for the validated run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MCP CLI
        if: steps.check.outputs.configured == 'true'
        working-directory: mcp
        run: npm run build

      - name: Frontend env for e2e
        if: steps.check.outputs.configured == 'true'
        run: cp frontend/.env.example frontend/.env

      - name: Install Playwright browsers (Linux — includes system deps)
        if: steps.check.outputs.configured == 'true' && matrix.os == 'ubuntu-latest'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browsers (Windows — no system deps needed)
        # `--with-deps` runs apt-get; on Windows it's a no-op-ish but
        # explicitly omitting it surfaces a clearer error if browsers
        # can't be downloaded.
        if: steps.check.outputs.configured == 'true' && matrix.os == 'windows-latest'
        working-directory: frontend
        run: npx playwright install chromium

      - name: Playwright e2e (UI)
        if: steps.check.outputs.configured == 'true'
        working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"

      - name: E2E tests
        if: steps.check.outputs.configured == 'true'
        working-directory: mcp
        # Route through the JSON-reporter wrapper that tolerates vitest 4's
        # "Worker exited unexpectedly" teardown crash on Windows CI.
        # Without the wrapper, all 121 e2e tests pass but vitest exits 1
        # because tinypool's fork-worker shutdown races; the wrapper reads
        # the JSON report and exits 0 when there are no test failures.
        # See mcp/scripts/run-tests.mjs for the rationale + the matching
        # `npm test` script wiring already in place for the verify job.
        run: node ./scripts/run-tests.mjs test/e2e/
        env:
          # TEST_E2E flag retired — e2e collection moved to vitest.e2e.config.ts
          # (selected automatically by run-tests.mjs for test/e2e paths).
          TEST_API_URL: ${{ secrets.TEST_API_URL }}
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}

      - name: Upload Playwright report
        if: failure() && steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: frontend/playwright-report/
          retention-days: 7

  proxy-linux-e2e:
    # Cross-distro Linux trust-store install gate (Slice A.5).
    # Builds 5 distro-specific Docker containers and runs `synapsesync
    # capture proxy install/status/uninstall` against each one's REAL
    # trust store — covers spec §4.2 paths (debian / rhel / unknown).
    # Cannot run on the maintainer's macOS machine because Netskope
    # blocks container egress to the public npm registry; this is the
    # canonical validation environment.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, ubuntu, fedora, rockylinux, arch]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: scripts/e2e-linux/Dockerfile.${{ matrix.distro }}
          tags: synapse-e2e-${{ matrix.distro }}:ci
          load: true
          cache-from: type=gha,scope=proxy-linux-${{ matrix.distro }}
          cache-to: type=gha,scope=proxy-linux-${{ matrix.distro }},mode=max

      - name: Run E2E
        run: docker run --rm synapse-e2e-${{ matrix.distro }}:ci

  proxy-windows-e2e:
    # Windows trust-store install gate (Slice B). Mirror of the Linux
    # Docker matrix shape but runs natively on windows-latest because
    # (a) Windows containers are heavier than the test value justifies,
    # (b) GHA's windows-latest already ships Git-for-Windows (which
    # provides openssl on PATH) + certutil (builtin since Vista) — the
    # two tools the daemon's openssl-spawn + WindowsBackend need.
    # Validates `synapsesync capture proxy install/status/uninstall`
    # against the real CurrentUser Root certificate store.
    runs-on: windows-latest
    timeout-minutes: 15
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (workspace root)
        run: npm install --no-audit --no-fund

      - name: Build mcp CLI
        run: npm run build --workspace=mcp

      - name: Run Windows proxy E2E
        # `pwsh` = PowerShell 7 Core. UTF-8 native, modern parser, cross-OS
        # consistent. `powershell` (Windows PowerShell 5.1) reads scripts
        # as code-page-dependent and misparses UTF-8 chars as mojibake.
        shell: pwsh
        run: ./scripts/e2e-windows/e2e-proxy-install.ps1

  happy-flow-e2e:
    # The merge-gate test (`npm run test:e2e`) — the same 5-script suite
    # developers run locally before merging — pinned to BOTH Linux and
    # Windows. Proves the universal driver + curl-via-proxy + recall
    # paths actually work on every supported OS, not just whichever
    # machine the dev happened to use.
    #
    # The scripts are agent-agnostic: Stage 3 + Stage 7 use the universal
    # LLM driver (direct-API curl with ANTHROPIC_API_KEY / OPENROUTER_API_KEY
    # / DEEPSEEK_API_KEY — whichever is configured), proxy-layer5 +
    # proxy-source use curl through TLS-MITM. No `claude not on PATH →
    # exit 0` soft-skip in any of them.
    #
    # Graceful skip pattern: when secrets aren't configured (tanmain/
    # synapse), the job logs a notice and exits green. The canonical run
    # is on metanmai/synapse where SYNAPSE_E2E_API_KEY + at least one
    # provider API key are configured.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # Runs after the stale-project sweep so the merge-gate scripts have
    # quota headroom on the shared E2E account (50-project cap).
    needs: [verify, cleanup-e2e-account]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows; same shell on Linux. Lets one set of
        # commands handle both runners without per-OS branches.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the rest of the e2e matrix — Node 24 for native .ts
          # type-stripping on Windows.
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check secrets are configured
        # Mirrors the `e2e` job's pattern: skip-green when keys are absent
        # (tanmain), run-validated when present (metanmai). Requires
        # SYNAPSE_E2E_API_KEY + at least one provider API key.
        id: check
        env:
          SYNAPSE_E2E_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$SYNAPSE_E2E_API_KEY" ]; then
            echo "::notice::happy-flow-e2e skipped — SYNAPSE_E2E_API_KEY not configured. Mirror to metanmai/synapse for the validated run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ] && [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::notice::happy-flow-e2e skipped — no LLM provider key configured (needs ANTHROPIC_API_KEY / OPENROUTER_API_KEY / DEEPSEEK_API_KEY). Mirror to metanmai/synapse for the validated run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build mcp
        if: steps.check.outputs.configured == 'true'
        run: npm run build --workspace=mcp

      - name: Install Synapse hooks + config (synapsesync init)
        # The merge-gate suite assumes a previously-onboarded machine:
        #   • Stage 1.3 asserts ~/.claude/settings.json has the 6 hook
        #     entries that `synapsesync init` writes.
        #   • Stage 9.stats reads the API key from .mcp.json /
        #     ~/.synapse/config.json (detectExistingSetup) — env-var
        #     fallback isn't part of that resolver.
        # A fresh GitHub Actions runner has neither file. On a real
        # dev machine, `synapsesync init` runs once during onboarding.
        # CI has no onboarding step, so we run it non-interactively
        # here. The CI runner becomes shape-equivalent to a freshly
        # onboarded user's machine; the merge-gate scripts can stay
        # focused on testing the use-path rather than the install-path.
        #
        # --skip-service bypasses the launchd plist / systemd unit /
        # Task Scheduler XML write. The "Start daemon-proper" step
        # below backgrounds the daemon process directly.
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
        run: node mcp/dist/index.js init --api-key "$SYNAPSE_API_KEY" --skip-service

      - name: Enable proxy (spawns capture-worker)
        # `capture proxy enable` writes proxy-config.json + spawns a fresh
        # detached capture-worker process (which owns the file watcher +
        # the TLS-MITM proxy listening on 7727). SYNAPSE_API_KEY is
        # exported so any process spawned in this shell session inherits
        # it.
        #
        # NOTE: this step does NOT start the daemon-proper (the process
        # that owns the handoff sync loop + writes daemon.healthcheck).
        # On a real machine the OS service (launchd / systemd / Task
        # Scheduler) starts daemon-proper. CI runners don't have that,
        # so the next step starts it manually.
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
        run: |
          mkdir -p "$HOME/.synapse"
          node mcp/dist/index.js capture proxy enable

      - name: Start daemon-proper (handoff loop + healthcheck heartbeat)
        # The daemon-proper is a separate process from the capture-worker.
        # It owns the per-project flush/pull cycle, the pull-handoff
        # pre-warm, and the daemon.healthcheck heartbeat that the next
        # step polls for. Locally an OS service unit (launchd plist /
        # systemd unit / Task Scheduler XML) runs it; in CI we have to
        # background it manually. `nohup ... &` works in both Bash on
        # Linux and Git Bash on Windows.
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
        run: |
          nohup node mcp/dist/index.js daemon > "$HOME/.synapse/daemon.log" 2>&1 &
          echo "daemon-proper backgrounded (PID $!) — log: $HOME/.synapse/daemon.log"

      - name: Wait for daemon healthcheck
        # daemon-proper's startHandoffLoop() writes ~/.synapse/daemon.healthcheck
        # on a setInterval cadence (default 10s). 30s budget gives the
        # spawned process plenty of time to import modules + reach the
        # first interval tick.
        if: steps.check.outputs.configured == 'true'
        run: |
          for i in $(seq 1 30); do
            if [ -f "$HOME/.synapse/daemon.healthcheck" ]; then
              echo "Daemon healthcheck present after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Daemon never wrote healthcheck file after 30s"
          echo "--- ~/.synapse/daemon.log ---"
          cat "$HOME/.synapse/daemon.log" 2>/dev/null || echo "(no daemon.log)"
          echo "--- ~/.synapse/capture.log ---"
          cat "$HOME/.synapse/capture.log" 2>/dev/null || echo "(no capture.log)"
          exit 1

      - name: Run merge gate (npm run test:e2e)
        # Stage 3 + Stage 7 use direct-API mode via whichever provider key
        # is configured (ANTHROPIC / OPENROUTER / DEEPSEEK). No claude/crush
        # binary required. proxy-layer5 + proxy-source use curl.
        # proxy-lifecycle manages its own daemons.
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run test:e2e

      - name: Dump daemon log on failure
        # The Stage-6 background-recompute path spawns a detached
        # `synapsesync pull-handoff` child whose stderr is redirected to
        # ~/.synapse/pull-compact-bg.log (see spawnBackgroundRecompute in
        # mcp/src/capture/pull-compact.ts:506). When Stage 6 times out
        # waiting for handoff_markdown, that log is the load-bearing
        # diagnostic — capture.log only shows the proxy capture/sync
        # events, and daemon.log only shows daemon-proper's handoff loop.
        # Without dumping pull-compact-bg.log we can't tell whether the
        # spawn failed to start, the /compact endpoint returned 503, or
        # something else entirely.
        if: failure() && steps.check.outputs.configured == 'true'
        run: |
          echo "--- ~/.synapse/capture.log (last 200 lines) ---"
          tail -200 "$HOME/.synapse/capture.log" 2>/dev/null || true
          echo "--- ~/.synapse/daemon.log (last 200 lines) ---"
          tail -200 "$HOME/.synapse/daemon.log" 2>/dev/null || true
          echo "--- ~/.synapse/pull-compact-bg.log (last 400 lines) ---"
          tail -400 "$HOME/.synapse/pull-compact-bg.log" 2>/dev/null || echo "(no pull-compact-bg.log — background recompute never spawned, or spawned and produced no stderr)"
          echo "--- ~/.synapse/proxy-config.json ---"
          cat "$HOME/.synapse/proxy-config.json" 2>/dev/null || true
          echo "--- ~/.synapse/project-map.json ---"
          cat "$HOME/.synapse/project-map.json" 2>/dev/null || echo "(no project-map.json)"

  insight-roundtrip-e2e:
    # Continuous coverage of the brief-recall loop (LAUNCH-READINESS #6):
    # capture → backend project resolve → save_insight → SessionStart hook
    # composes a brief that contains the insight phrase. Runs on Ubuntu
    # only — the proxy capture → CloudSync → /api/projects materialization
    # tail latency on the windows-latest runner consistently overruns any
    # bounded poll budget (observed 60s, 120s, 130s in metanmai runs
    # 27281443605 / 27283047790 / 27284091981). The bug class under
    # guard is OS-neutral business logic, so the Ubuntu leg gives full
    # coverage without forcing a fragile timeout race on Windows. The
    # Windows-side capture-worker timing is tracked as a separate
    # follow-up in LAUNCH-READINESS "NICE-TO-HAVE".
    #
    # Runs in parallel with happy-flow-e2e (no `needs` dependency on it) —
    # both account-creating jobs are gated behind cleanup-e2e-account
    # which provides enough quota headroom for both to coexist.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify, cleanup-e2e-account]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check secrets are configured
        id: check
        env:
          SYNAPSE_E2E_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$SYNAPSE_E2E_API_KEY" ]; then
            echo "::notice::insight-roundtrip-e2e skipped — SYNAPSE_E2E_API_KEY not configured. Mirror to metanmai/synapse for the validated run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ] && [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::notice::insight-roundtrip-e2e skipped — no LLM provider key configured. Mirror to metanmai/synapse for the validated run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build mcp
        if: steps.check.outputs.configured == 'true'
        run: npm run build --workspace=mcp

      - name: Install hooks + enable proxy + start daemon
        # Same one-machine onboarding shape as happy-flow-e2e: init writes
        # hooks/.mcp.json, proxy enable spawns capture-worker, daemon
        # background-spawn drives the handoff loop.
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
        run: |
          mkdir -p "$HOME/.synapse"
          node mcp/dist/index.js init --api-key "$SYNAPSE_API_KEY" --skip-service
          node mcp/dist/index.js capture proxy enable
          nohup node mcp/dist/index.js daemon > "$HOME/.synapse/daemon.log" 2>&1 &
          for i in $(seq 1 30); do
            if [ -f "$HOME/.synapse/daemon.healthcheck" ]; then
              echo "Daemon healthcheck present after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Daemon never wrote healthcheck file after 30s"
          exit 1

      - name: Run insight-roundtrip
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/e2e-insight-roundtrip.mjs

      - name: Dump daemon log on failure
        if: failure() && steps.check.outputs.configured == 'true'
        run: |
          echo "--- ~/.synapse/capture.log (last 200 lines) ---"
          tail -200 "$HOME/.synapse/capture.log" 2>/dev/null || true
          echo "--- ~/.synapse/daemon.log (last 200 lines) ---"
          tail -200 "$HOME/.synapse/daemon.log" 2>/dev/null || true

  project-cap-e2e:
    # LAUNCH-READINESS #7 — continuous coverage of the structured 402
    # PROJECT_QUOTA_EXCEEDED contract: the exact bug class that turned CI
    # red for two days when the E2E account organically hit the cap.
    #
    # DELIBERATELY SERIAL, NOT part of the per-leg merge gate: the script
    # saturates the 50-project cap to assert the 402, which would starve
    # any job running concurrently against the same account. So it needs
    # BOTH happy-flow legs to finish first, runs on one OS only (the cap
    # logic is backend-side; OS coverage adds nothing), and the script
    # pre-cleans its own e2e-cap-test-* residue from crashed prior runs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needs ALL account-using jobs done — saturating the cap while any of
    # them is still creating projects would 402 their creates.
    needs: [happy-flow-e2e, e2e, insight-roundtrip-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check secrets are configured
        id: check
        env:
          SYNAPSE_E2E_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
        run: |
          if [ -z "$SYNAPSE_E2E_API_KEY" ]; then
            echo "::notice::project-cap-e2e skipped — SYNAPSE_E2E_API_KEY not configured. Mirror to metanmai/synapse for the validated run."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sweep stale test-account projects (headroom for saturation)
        # The cap script skips itself when the account holds > 45 projects
        # (its safety guard against eating a real account's headroom). The
        # happy-flow legs that just finished left fresh residue, so sweep
        # again — anything they leaked is fair game once the legs are done,
        # hence a tighter 10-minute threshold here.
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_E2E_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
        run: node scripts/cleanup-test-account.mjs --yes --older-than-minutes 10

      - name: Run project-cap e2e (402 quota contract)
        if: steps.check.outputs.configured == 'true'
        env:
          SYNAPSE_API_KEY: ${{ secrets.SYNAPSE_E2E_API_KEY }}
        run: node scripts/e2e-project-cap.mjs
